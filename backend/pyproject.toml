[tool.poetry]
name = "symm-city-bot"
version = "0.1.0"
description = "Feature-rich community Telegram bot for symm.city."
authors = ["symmetricalboy <email@symmetricalboy.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
python-telegram-bot = {version = "^22.6", extras = ["webhooks", "job-queue"]}
python-dotenv = "^1.0.1"
asyncpg = "^0.31.0"
fastapi = "^0.135.1"
uvicorn = {extras = ["standard"], version = "^0.41.0"}
google-genai = "^1.65.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
